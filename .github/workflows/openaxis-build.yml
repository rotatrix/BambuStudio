name: OpenAxis desktop builds
on:
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (artifacts only)
        type: choice
        default: all
        options: [all, windows, macos, linux]
permissions:
  contents: read
concurrency:
  group: openaxis-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
jobs:
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      OPENAXIS_MAC_ARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON('{"all":[{"platform":"windows-x64","runner":"windows-2022","script":"windows","prefix":"deps/build/BambuStudio_dep","arch":"x64"},{"platform":"macos-arm64","runner":"macos-15","script":"macos","prefix":"deps/build/arm64/BambuStudio_deps","arch":"arm64"},{"platform":"macos-x86_64","runner":"macos-15-intel","script":"macos","prefix":"deps/build/x86_64/BambuStudio_deps","arch":"x86_64"},{"platform":"macos-arm64-macos26","runner":"macos-26","script":"macos","prefix":"deps/build/arm64/BambuStudio_deps","arch":"arm64"},{"platform":"linux-x64","runner":"ubuntu-24.04","script":"linux","prefix":"deps/build/destdir","arch":"x64"},{"platform":"linux-x64-ubuntu22","runner":"ubuntu-22.04","script":"linux","prefix":"deps/build/destdir","arch":"x64"},{"platform":"linux-x64-ubuntu26","runner":"ubuntu-26.04","script":"linux","prefix":"deps/build/destdir","arch":"x64"}],"windows":[{"platform":"windows-x64","runner":"windows-2022","script":"windows","prefix":"deps/build/BambuStudio_dep","arch":"x64"}],"macos":[{"platform":"macos-arm64","runner":"macos-15","script":"macos","prefix":"deps/build/arm64/BambuStudio_deps","arch":"arm64"},{"platform":"macos-x86_64","runner":"macos-15-intel","script":"macos","prefix":"deps/build/x86_64/BambuStudio_deps","arch":"x86_64"},{"platform":"macos-arm64-macos26","runner":"macos-26","script":"macos","prefix":"deps/build/arm64/BambuStudio_deps","arch":"arm64"}],"linux":[{"platform":"linux-x64","runner":"ubuntu-24.04","script":"linux","prefix":"deps/build/destdir","arch":"x64"},{"platform":"linux-x64-ubuntu22","runner":"ubuntu-22.04","script":"linux","prefix":"deps/build/destdir","arch":"x64"},{"platform":"linux-x64-ubuntu26","runner":"ubuntu-26.04","script":"linux","prefix":"deps/build/destdir","arch":"x64"}]}')[inputs.platform || 'all'] }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release guards
        run: python -B tests/openaxis/test_release.py
      - name: Install CMake and Ninja
        run: python -m pip install cmake==3.31.6 ninja
      - name: Prepare logs
        run: mkdir -p ci-logs dist
      - name: Windows compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Windows prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/openaxis-windows-setup.ps1
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo ./BuildLinux.sh -ur
          sudo apt-get install -y xvfb libfuse2
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install automake texinfo libtool gettext nasm yasm pkg-config
      - name: Restore dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.prefix }}
          key: bambu-28261-v1-${{ matrix.platform }}-${{ hashFiles('deps/**') }}
      - name: Build dependencies (Unix)
        if: runner.os != 'Windows' && steps.deps.outputs.cache-hit != 'true'
        run: bash .github/scripts/openaxis-unix.sh '${{ matrix.script }}' deps 2>&1 | tee ci-logs/deps.log
      - name: Build dependencies (Windows)
        if: runner.os == 'Windows' && steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: .github/scripts/openaxis-windows.ps1 deps *>&1 | Tee-Object ci-logs/deps.log
      - name: Save dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.prefix }}
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Build and package (Unix)
        if: runner.os != 'Windows'
        run: bash .github/scripts/openaxis-unix.sh '${{ matrix.script }}' build 2>&1 | tee ci-logs/build.log
      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/openaxis-windows.ps1 build *>&1 | Tee-Object ci-logs/build.log
      - name: Package provenance and checksums
        run: python .github/scripts/openaxis-package.py '${{ matrix.platform }}'
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: BambuStudio-Rotatrix-${{ matrix.platform }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          compression-level: 0
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ci-logs/
            build/CMakeCache.txt
            build/arm64/CMakeCache.txt
            build/**/CMakeConfigureLog.yaml
            deps/build/**/CMakeConfigureLog.yaml
            deps/build/**/config.log
            build/openaxis-checks/Testing/Temporary/LastTest.log
          overwrite: true
          retention-days: 14
