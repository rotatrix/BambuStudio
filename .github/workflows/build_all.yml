name: Build all

on:
  push:
    branches: [master, 'rotatrix/**']
    tags: ['*-rotatrix.*']
  pull_request:
    branches: [master, 'rotatrix/*']
  workflow_dispatch:
    inputs:
      build-deps-only:
        description: Only build upstream dependencies (master)
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build_all:
    name: Build All
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: ubuntu-24.04
          - os: ubuntu-26.04
          - os: windows-latest
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: macos-26
            arch: arm64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
    secrets: inherit

  rotatrix-test:
    if: startsWith(github.ref, 'refs/heads/rotatrix/') || startsWith(github.base_ref, 'rotatrix/')
    uses: ./.github/workflows/openaxis-build.yml
  rotatrix-release:
    if: github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, '-rotatrix.')
    uses: ./.github/workflows/openaxis-build.yml
  release:
    name: Release tag packages
    needs: rotatrix-release
    if: github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, '-rotatrix.')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: BambuStudio-Rotatrix-*-${{ github.sha }}
          merge-multiple: true
          path: release-assets
      - name: Validate packages and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python .github/scripts/openaxis-release.py release-assets
