name: OpenAxis desktop builds
on:
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: Approved full SHA matching the selected branch head
        type: string
        required: true
      platform:
        description: Platform to build (artifacts only)
        type: choice
        default: all
        options: [all, windows, macos, linux]
permissions:
  contents: read
concurrency:
  group: openaxis-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false
env:
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
jobs:
  desktop:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      OPENAXIS_MAC_ARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON('{"all":[{"platform":"windows-x64","runner":"windows-2022","script":"windows","prefix":"deps/build/BambuStudio_dep","arch":"x64"},{"platform":"macos-arm64","runner":"macos-15","script":"macos","prefix":"deps/build/arm64/BambuStudio_deps","arch":"arm64"},{"platform":"macos-x86_64","runner":"macos-15-intel","script":"macos","prefix":"deps/build/x86_64/BambuStudio_deps","arch":"x86_64"},{"platform":"linux-x64-ubuntu22","runner":"ubuntu-22.04","script":"linux","prefix":"deps/build/destdir","arch":"x64"}],"windows":[{"platform":"windows-x64","runner":"windows-2022","script":"windows","prefix":"deps/build/BambuStudio_dep","arch":"x64"}],"macos":[{"platform":"macos-arm64","runner":"macos-15","script":"macos","prefix":"deps/build/arm64/BambuStudio_deps","arch":"arm64"},{"platform":"macos-x86_64","runner":"macos-15-intel","script":"macos","prefix":"deps/build/x86_64/BambuStudio_deps","arch":"x86_64"}],"linux":[{"platform":"linux-x64-ubuntu22","runner":"ubuntu-22.04","script":"linux","prefix":"deps/build/destdir","arch":"x64"}]}')[inputs.platform || 'all'] }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify approved candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release guards
        run: python -B tests/openaxis/test_release.py
      - name: Validate macOS package transport
        if: runner.os == 'macOS'
        run: python -B tests/openaxis/test_macos_package.py
      - name: Install CMake and Ninja
        run: python -m pip install cmake==3.31.6 ninja
      - name: Validate macOS plugin signatures
        if: runner.os == 'macOS'
        run: python -B tests/openaxis/test_macos_plugin.py
      - name: Validate macOS deployment gate
        if: runner.os == 'macOS'
        run: python -B tests/openaxis/test_macos_deployment.py
      - name: Prepare logs
        run: mkdir -p ci-logs dist
      - name: Windows compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Windows prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/openaxis-windows-setup.ps1
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo ./BuildLinux.sh -ur
          sudo apt-get install -y xvfb libfuse2
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install automake texinfo libtool gettext nasm yasm pkg-config
      - name: Restore dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.prefix }}
          key: bambu-28261-v1-${{ matrix.platform }}-${{ hashFiles('deps/**') }}
      - name: Build dependencies (Unix)
        if: runner.os != 'Windows' && steps.deps.outputs.cache-hit != 'true'
        run: bash .github/scripts/openaxis-unix.sh '${{ matrix.script }}' deps 2>&1 | tee ci-logs/deps.log
      - name: Build dependencies (Windows)
        if: runner.os == 'Windows' && steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: .github/scripts/openaxis-windows.ps1 deps *>&1 | Tee-Object ci-logs/deps.log
      - name: Save dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.prefix }}
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Build and package (Unix)
        if: runner.os != 'Windows'
        run: bash .github/scripts/openaxis-unix.sh '${{ matrix.script }}' build 2>&1 | tee ci-logs/build.log
      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/openaxis-windows.ps1 build *>&1 | Tee-Object ci-logs/build.log
      - name: Package and smoke-test
        run: python .github/scripts/openaxis-package.py '${{ matrix.platform }}'
      - name: Attest trusted package
        if: github.repository == 'rotatrix/BambuStudio' && startsWith(github.ref, 'refs/heads/rotatrix/')
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
      - name: Upload package directly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: |
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ci-logs/
            build/CMakeCache.txt
            build/arm64/CMakeCache.txt
            build/**/CMakeConfigureLog.yaml
            deps/build/**/CMakeConfigureLog.yaml
            deps/build/**/config.log
            build/openaxis-checks/Testing/Temporary/LastTest.log
          overwrite: true
          retention-days: 14
