name: Build all

on:
  workflow_dispatch:
    inputs:
      build-deps-only:
        description: Only build upstream dependencies (master)
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build_all:
    name: Build All
    if: github.repository == 'bambulab/BambuStudio'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: ubuntu-24.04
          - os: ubuntu-26.04
          - os: windows-latest
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: macos-26
            arch: arm64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
    secrets: inherit
